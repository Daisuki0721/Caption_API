api:
  base_url: https://ws-9eaupaeyp0hh6lcp.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  request:
    model: qwen3.5-omni-plus
    stream: false
    timeout: 120
    messages:
      - role: user
        content:
          - type: video_url
            video_url:
              url: "{video_url}"
          - type: text
            text: "{prompt}"
  json_response_format:
    type: json_object

batch:
  request:
    method: POST
    url: /v1/chat/completions
    body:
      model: qwen3.5-omni-plus
      messages:
        - role: user
          content:
            - type: video_url
              video_url:
                url: "{video_url}"
            - type: text
              text: "{prompt}"
  json_response_format:
    type: json_object
  completion_window: 24h
